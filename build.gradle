plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.3'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

// Also used by the Kotlin interoperability tests.
ext.springBootVersion = '4.1.1'

group = 'io.github.mahdibohloul'
version = '3.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // Exposed on the consumer's compile classpath (public API surface).
    api 'org.springframework:spring-context'
    api 'org.springframework:spring-core'
    api 'io.projectreactor:reactor-core'
    // Null-safety annotations on the public API, read by Kotlin 2.x callers.
    api 'org.jspecify:jspecify'

    // Internal only.
    implementation 'org.slf4j:slf4j-api'

    // Only to call suspend recover functions. Spring loads these classes only
    // when the application uses Kotlin coroutines.
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-core'

    testImplementation 'org.aspectj:aspectjweaver'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Align the JUnit Platform launcher with the BOM-managed engine (required
    // without the Spring Boot plugin, which otherwise pins the launcher).
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Publish the concrete versions resolved from the BOM into the POM and the
// Gradle Module Metadata, instead of leaving BOM-managed dependencies without
// a version (which fails publication validation).
publishing {
    publications.withType(MavenPublication).configureEach {
        versionMapping {
            usage('java-api') {
                fromResolutionOf('runtimeClasspath')
            }
            usage('java-runtime') {
                fromResolutionResult()
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name.set("projectreactor-retry-aop")
        description.set("ProjectReactor Retry AOP provides convenient retry support for your reactive applications.")
        url.set("https://github.com/mahdibohloul/projectreactor.retry.aop")
        inceptionYear.set("2022")
        licenses {
            license {
                name.set("MIT License")
                url.set("https://opensource.org/licenses/MIT")
                distribution.set("repo")
            }
        }
        developers {
            developer {
                id.set("mahdibohloul")
                name.set("Mahdi Bohloul")
                email.set("mahdiibohloul@gmail.com")
                url.set("https://github.com/mahdibohloul/")
            }
        }
        scm {
            url.set("https://github.com/mahdibohloul/projectreactor.retry.aop")
            connection.set("scm:git:https://github.com/mahdibohloul/projectreactor.retry.aop.git")
            developerConnection.set("scm:git:ssh://git@github.com/mahdibohloul/projectreactor.retry.aop.git")
        }
        issueManagement {
            system.set("GitHub")
            url.set("https://github.com/mahdibohloul/projectreactor.retry.aop/issues")
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Reproducible build artifacts.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        eclipse()
        trimTrailingWhitespace()
        leadingSpacesToTabs(4)
        endWithNewline()
    }
}
